[runtime]
max_steps = 12
max_consecutive_failures = 2
lock_path = ".xm-agent/agent.lock"
lock_ttl_seconds = 60
default_adapter = "mock"

[audit]
root = ".xm-agent/audit"
keep_days = 7

[model]
provider = "openai_compat"
base_url = "https://api.openai.com/v1"
model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 60
temperature = 0.0
# computer_use 后端需要视觉模型：设为 true 且 model 必须支持图像输入。
vision = false

[policy]
allowed_capabilities = [
  "desktop.observe",
  "desktop.act",
  "desktop.verify",
  "terminal.exec",
  "file.transfer",
  "wait.for",
  "task.finish",
]
allowed_command_prefixes = [
  "echo",
  "dir",
  "type",
  "Get-ChildItem",
  "git status",
]
require_confirmation = ["file.transfer"]
allowed_paths = ["D:/work"]

[adapters.mock]
kind = "mock"

[adapters.windows]
kind = "windows_mcp"
command = ["vendor/Windows-MCP/.venv/Scripts/python.exe", "-m", "windows_mcp", "serve"]
cwd = "vendor/Windows-MCP"

[adapters.windows.env]
PYTHONIOENCODING = "utf-8"
POSTHOG_API_KEY = ""

[adapters.windows.tools]
observe = "Snapshot"
screenshot = "Screenshot"
click = "Click"
type = "Type"
key = "Shortcut"
scroll = "Scroll"
move = "Move"
wait_for = "WaitFor"

[adapters.xshell]
# 框架保留：本机未安装 Xshell，真实会话暂不验证。
kind = "xshell_mcp"
command = ["node", "vendor/xshell-mcp/dist/server.js"]
cwd = "vendor/xshell-mcp"

[adapters.xshell.env]
XSHELL_MCP_CONFIG = "D:/xm/agent/config/xshell-mcp.json"

[adapters.xshell.tools]
exec = "xshell_exec"
read = "xshell_read_screen"
wait_for = "xshell_wait_for"

[adapters.computer_use]
# 视觉通道：需先执行 npm install && npm run build，并提供视觉模型。
kind = "computer_use_mcp"
command = ["node", "vendor/computer-use-mcp/dist/main.js"]
cwd = "vendor/computer-use-mcp"

[adapters.computer_use.tools]
computer = "computer"
