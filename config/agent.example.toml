[runtime]
# 长任务建议 30 步以上；每步失败上限与模型输出重试次数分开计算。
max_steps = 30
max_consecutive_failures = 2
# 模型返回非法 JSON、超时或 429 时自动重试，避免一次异常就结束整个任务。
max_provider_retries = 2
provider_retry_delay = 1.2
# 截图缓存目录；`xm_agent cleanup` 按 [audit].keep_days 清理其中的过期图片
screenshot_dir = ".xm-agent/screenshots"
# 需要接管桌面的任务运行期间最小化控制台，结束/暂停/等待确认时恢复窗口。
release_desktop = true
lock_path = ".xm-agent/agent.lock"
lock_ttl_seconds = 60
# auto = 由模型按任务自动挑后端：普通桌面任务优先 Windows-MCP；SSH、远程主机、
# Linux 等任务走 xshell；Windows-MCP 观测失败时回退 computer_use（需可识图模型）。
default_adapter = "mock"

# 内置浏览器通道（浏览器功能）。见 TECH_DESIGN 4.21。
# 只支持 Edge / Chrome / 内置 Chromium，其他浏览器不在支持范围。
[runtime.browser]
# 关闭后能力清单里不会出现 browser.*，模型也就不会尝试调用。
enabled = true
# auto = 按 Edge → Chrome → 内置 Chromium 顺序回落；指定具体引擎时缺失会直接报错，
# 不会静默换成别的浏览器。
engine = "auto"
# 每个引擎独立 profile，互不共享，也不读取你日常浏览器的数据；首次使用需扫码一次。
profile_root = ".xm-agent/browser/profiles"
# auto = 默认无头，遇到需要扫码的登录页自动切可见窗口；always / never 强制。
headless = "auto"
# 空闲多久后关闭内核（登录态在磁盘，重开即恢复）。
keep_alive_seconds = 300
# 镜像帧率与截图宽度。面板收起时停流，成本归零。
mirror_fps = 15
screenshot_max_width = 1280
connect_timeout = 20.0
# 无头模式原生 UA 带 HeadlessChrome、navigator.webdriver 为 true，不少站点（自如的
# 腾讯 EdgeOne 就是）据此直接返回「请求已被拦截」。这两条默认抹掉，浏览器在指纹上
# 等于普通浏览器；不含任何绕过登录/验证码的行为。
hide_automation = true
# 需要固定 UA 时才填；留空 = 按当前内核版本自动生成（可见窗口不覆盖）。
# user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) ..."

[audit]
root = ".xm-agent/audit"
keep_days = 7

[audit_ai]
# ai = 低风险自动执行，敏感操作交顶层审计模型；confirm_all = 所有写操作前询问。
# 不提供关闭审计或完全访问的选项。
mode = "ai"
# 留空时使用可识图的执行模型或活动模型；审计模型必须支持图像输入，界面会拒绝纯文本模型。
# 界面里的「审计模型」选择保存在数据库中，会覆盖这里；选择「自动选择」则继续按下面回退。
model_provider_id = ""
model_id = ""
timeout_seconds = 12
fail_closed = true
protected_paths = [
  "C:/Users/*/.ssh",
  "C:/Users/*/.aws",
]
# 这些能力即使顶层 AI 判定 allow 也必须由用户确认一次。
always_confirm = ["file.transfer", "terminal.exec"]

[model]
provider = "openai_compat"
base_url = "https://api.openai.com/v1"
model = "gpt-4.1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 120
temperature = 0.0
# 任务上下文预算按窗口的 35% 计算；超出后较早对话会自动压缩成摘要。
context_window = 32768
# 图像输入能力由官方模型列表/模型名称自动判定，不在这里手动开关。

[policy]
allowed_capabilities = [
  "desktop.observe",
  "desktop.act",
  "desktop.verify",
  "browser.open",
  "browser.observe",
  "browser.act",
  "browser.verify",
  "browser.session",
  "terminal.exec",
  "file.transfer",
  "wait.for",
  "task.finish",
  "task.await_user",
]
allowed_command_prefixes = [
  "echo",
  "dir",
  "type",
  "Get-ChildItem",
  "git status",
]
require_confirmation = ["file.transfer"]
allowed_paths = ["D:/work"]

[adapters.mock]
kind = "mock"

[adapters.windows]
kind = "windows_mcp"
# --config 相对 cwd 解析：config/windows-mcp.toml 关闭了 Windows-MCP 自带的
# 同意弹窗与所有权钩子，改由 XM Agent 统一提示和暂停。
command = ["vendor/Windows-MCP/.venv/Scripts/python.exe", "-m", "windows_mcp", "serve", "--config", "../../config/windows-mcp.toml"]
cwd = "vendor/Windows-MCP"

[adapters.windows.env]
PYTHONIOENCODING = "utf-8"
POSTHOG_API_KEY = ""

[adapters.windows.tools]
observe = "Snapshot"
screenshot = "Screenshot"
click = "Click"
type = "Type"
key = "Shortcut"
scroll = "Scroll"
move = "Move"
wait_for = "WaitFor"

[adapters.xshell]
# 框架保留：本机未安装 Xshell，真实会话暂不验证。
kind = "xshell_mcp"
# node 的脚本参数按 cwd 解析，这里写相对 cwd 的入口。
command = ["node", "dist/server.js"]
cwd = "vendor/xshell-mcp"

[adapters.xshell.env]
# 相对 vendor/xshell-mcp 工作目录解析。
XSHELL_MCP_CONFIG = "../../config/xshell-mcp.json"

[adapters.xshell.tools]
exec = "xshell_exec"
read = "xshell_read_screen"
wait_for = "xshell_wait_for"

[adapters.computer_use]
# 视觉通道：资源管理器负责构建，并提供视觉模型。
kind = "computer_use_mcp"
# node 的脚本参数按 cwd 解析，这里写相对 cwd 的入口。
command = ["node", "dist/main.js"]
cwd = "vendor/computer-use-mcp"

[adapters.computer_use.tools]
computer = "computer"

[resources]
# off = 不查上游版本；notify = 面板提示有新版本（手动点「升级」）；
# auto = 同大版本自动升级：先装到旁路目录，探针通过才切换，失败保留旧版。
# 跨大版本一律只提示——MCP 工具集会变，而提示词与审计规则是按当前工具集写的。
update_check = "notify"
